# The machinery's own dependencies: the actions its workflows pin, and the Gradle plugins and libraries of its version
# catalog, which the plugins carry to every app. Self automation merges them once Self CI is green. Both kinds are
# `fix` commits: apps only get them through a machinery release, which a fix makes.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    # Dependabot takes only default-days for actions: the semver-*-days keys make it refuse the whole file.
    cooldown:
      default-days: 3
    commit-message:
      prefix: fix
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
