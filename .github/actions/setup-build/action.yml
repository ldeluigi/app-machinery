name: Set up build
description: >-
  Installs the JDK the app names in .java-version and Gradle, with GitHub's own cache (free for public and private
  repositories alike). Only jobs on the default branch write the cache; the others read it.
inputs:
  cache-read-only:
    description: Whether this job only reads the Gradle cache.
    default: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version-file: .java-version
    # Gradle's downloads and caches, keyed on the build's files. A change to them (a version bump, say) starts from the
    # newest earlier cache and downloads only what changed: setup-gradle's own cache restores exact matches only, so
    # every bump started from nothing. Gradle deletes what no build used for 30 days, so the cache doesn't grow forever.
    - if: inputs.cache-read-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle.kts', '**/gradle/*.versions.toml', '**/gradle-wrapper.properties', '.java-version') }}
        restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.cache-read-only == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle.kts', '**/gradle/*.versions.toml', '**/gradle-wrapper.properties', '.java-version') }}
        restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: true
