name: Publish commits
description: >-
  Pushes the commits an AI agent made to `branch` as the bot App and, for a new branch, opens the pull request: titled
  by the first commit's subject (the agents write it to name the whole change), labelled, and with `body`. The commits
  come from the agent's job as a bundle (`artifact`, from .github/actions/bundle-commits): this action runs in a job
  where no agent and none of its builds ran, fetches them without checking them out, and works out by itself, in a
  fresh checkout of the branch the agent started from, what they add. The bot App token has no Workflows permission, so
  a commit that touches workflow files is refused; so are, here, commits that change what the agents themselves may do
  (`protected`), which stays the owner's to change. Expects that fresh checkout, with all its history, and the
  machinery checked out in .machinery.
inputs:
  token:
    description: The bot App's token (contents and pull requests write)
    required: true
  branch:
    description: The branch to push to
    required: true
  artifact:
    description: The artifact that holds the agent's commits
    required: true
  open-pull-request:
    description: >-
      "true" for a new branch of the agent's own, from which a pull request is opened into the default branch; else
      the branch exists, and the commits must follow it
    default: "false"
  labels:
    description: The pull request's labels, comma-separated (created when missing)
    default: agent,automerge
  body:
    description: The pull request's description
    default: ""
  protected:
    description: >-
      The files and folders the agents' commits may not change, separated by spaces: the settings that decide what
      Claude Code and the Copilot CLI may run in the repository
    default: .claude/settings.json .claude/settings.local.json .mcp.json .github/copilot .github/hooks
outputs:
  pushed:
    description: '"true" when there were commits and they were pushed'
    value: ${{ steps.publish.outputs.pushed == 'true' }}
  pull-request:
    description: The pull request opened, if any
    value: ${{ steps.publish.outputs.pull-request }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/agent-commits
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
        OPEN: ${{ inputs.open-pull-request }}
        LABELS: ${{ inputs.labels }}
        BODY: ${{ inputs.body }}
        BASE: ${{ github.event.repository.default_branch }}
        PROTECTED: ${{ inputs.protected }}
        SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        # Fetched, never checked out: nothing the agent's job made runs here, and what that job says of its own commits
        # isn't taken on trust
        git -c fetch.fsckObjects=true fetch --quiet --no-tags "$RUNNER_TEMP/agent-commits/commits.bundle" HEAD
        tip="$(git rev-parse FETCH_HEAD)"
        kind=existing
        [ "$OPEN" != "true" ] || kind=new
        read -ra protected <<< "$PROTECTED"
        start="$("$SCRIPTS/check-agent-commits.sh" "$tip" "$kind" "${protected[@]}")"
        if [ -z "$start" ]; then
          echo "There are no commits to push."
          exit 0
        fi
        # Without the checkout's hooks, which would run with the token
        git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tip:refs/heads/$BRANCH"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
        if [ "$OPEN" = "true" ]; then
          # Not a pipe into head: under pipefail, head ending early fails the step when there are many commits
          title="$(git log --reverse --format=%s "$start..$tip" | sed -n 1p)"
          args=()
          IFS=',' read -ra names <<< "$LABELS"
          for name in "${names[@]}"; do
            name="$(echo "$name" | xargs)"
            [ -n "$name" ] || continue
            gh label create "$name" > /dev/null 2>&1 || true
            args+=(--label "$name")
          done
          url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body "$BODY" "${args[@]}")"
          echo "pull-request=$url" >> "$GITHUB_OUTPUT"
        fi
