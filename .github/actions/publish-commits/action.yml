name: Publish commits
description: >-
  Pushes the commits an AI agent made to `branch` as the bot App and, when asked, opens the pull request: titled by
  the branch's first commit's subject (the agents write it to name the whole change, and the commits that only saved
  an agent's unfinished work don't count), labelled, and with `body`. The commits
  come from the agent's job as a bundle (`artifact`, from .github/actions/bundle-commits): this action runs in a job
  where no agent and none of its builds ran, fetches them without checking them out, and works out by itself, in a
  fresh checkout of the branch the agent started from, what they add. The bot App token has no Workflows permission, so
  a commit that touches workflow files is refused; so are, here, commits that change what the agents themselves may do
  or the licences the app may ship (`protected`), which stay the owner's to change. Expects that fresh checkout, with
  all its history, and the machinery checked out in .machinery.
inputs:
  token:
    description: The bot App's token (contents and pull requests write)
    required: true
  branch:
    description: The branch to push to
    required: true
  artifact:
    description: The artifact that holds the agent's commits
    required: true
  open-pull-request:
    description: >-
      "true" to open a pull request from the branch into the default branch, for an agent's branch that has none yet
    default: "false"
  new-branch:
    description: >-
      "true" for a new branch of the agent's own, made from the default branch; "false" when the branch exists and the
      commits must follow it. Empty: the branch is new exactly when a pull request is opened (`open-pull-request`)
    default: ""
  labels:
    description: The pull request's labels, comma-separated (created when missing)
    default: agent,automerge
  body:
    description: The pull request's description
    default: ""
  protected:
    description: >-
      The files and folders the agents' commits may not change, separated by spaces: the settings that decide what
      Claude Code and the Copilot CLI may run in the repository, and the licences the app may ship besides the
      machinery's (an agent could otherwise make a failing licence check pass by allowing the licence)
    default: .claude/settings.json .claude/settings.local.json .mcp.json .github/copilot .github/hooks config/licences.txt
outputs:
  pushed:
    description: '"true" when there were commits and they were pushed'
    value: ${{ steps.publish.outputs.pushed == 'true' }}
  pull-request:
    description: The pull request opened, if any
    value: ${{ steps.publish.outputs.pull-request }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/agent-commits
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
        OPEN: ${{ inputs.open-pull-request }}
        NEW_BRANCH: ${{ inputs.new-branch }}
        LABELS: ${{ inputs.labels }}
        BODY: ${{ inputs.body }}
        BASE: ${{ github.event.repository.default_branch }}
        PROTECTED: ${{ inputs.protected }}
        SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        # Fetched, never checked out: nothing the agent's job made runs here, and what that job says of its own commits
        # isn't taken on trust
        git -c fetch.fsckObjects=true fetch --quiet --no-tags "$RUNNER_TEMP/agent-commits/commits.bundle" HEAD
        tip="$(git rev-parse FETCH_HEAD)"
        kind=existing
        if [ "$NEW_BRANCH" = "true" ] || { [ -z "$NEW_BRANCH" ] && [ "$OPEN" = "true" ]; }; then
          kind=new
        fi
        read -ra protected <<< "$PROTECTED"
        # What the default branch has, a merge of it brings in: the owner's files as they are there aren't the agent's
        start="$(BASE_REF="origin/$BASE" "$SCRIPTS/check-agent-commits.sh" "$tip" "$kind" "${protected[@]}")"
        if [ -z "$start" ]; then
          echo "There are no commits to push."
          exit 0
        fi
        # A new branch starts from the default branch as it is now, not as it was when the agent began: if a workflow
        # changed there meanwhile, a branch carrying the older file is a workflow change, which GitHub refuses from
        # the bot. The agent's commits are replayed on it, the same changes, without running anything of theirs;
        # when they don't apply as they are, they go as they were made.
        now="$(git rev-parse HEAD)"
        if [ "$kind" = "new" ] && [ "$now" != "$start" ]; then
          if git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            rebase --quiet --onto "$now" "$start" "$tip" > /dev/null 2>&1; then
            tip="$(git rev-parse HEAD)"
            start="$now"
            if [ "$tip" = "$now" ]; then
              echo "The agent's commits are all on $BASE already: there is nothing to push."
              exit 0
            fi
            echo "The agent's commits now follow $BASE as it is."
          else
            git rebase --abort > /dev/null 2>&1 || true
            echo "::warning::The agent's commits don't apply to $BASE as it is now: they are pushed as they were made."
          fi
        fi
        # Without the checkout's hooks, which would run with the token
        git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tip:refs/heads/$BRANCH"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
        if [ "$OPEN" = "true" ]; then
          # The whole branch, with the commits an earlier agent left on it unfinished: its first commit names the change
          from="$(git merge-base "origin/$BASE" "$tip")"
          url="$("$SCRIPTS/open-agent-pull-request.sh" "$BRANCH" "$from" "$tip")"
          echo "pull-request=$url" >> "$GITHUB_OUTPUT"
        fi
