name: Claude
description: >-
  Runs Claude Code (Anthropic's Claude Code action) as the bot App, on the owner's Claude subscription
  (CLAUDE_CODE_OAUTH_TOKEN) or an Anthropic API key, with the best model the plan has (Fable, or else Opus) at
  extra-high effort, and Opus when that model is unavailable or its own usage credit has run out: never a smaller
  model. Without a Claude credential it does nothing and "done" stays false. Claude reads of GitHub only what the
  prompt holds: the action runs in its agent mode, never in its tag mode, which would read an issue's or pull
  request's whole conversation, whoever wrote it (callers put what the agent may read of it in the prompt, from
  .github/actions/thread). Claude commits locally and pushes nothing: the caller publishes its commits as the bot App,
  whose token has no Workflows permission, so Claude can't change workflow files. Expects the app checked out without
  credentials, and the machinery checked out in .machinery.
inputs:
  prompt:
    description: What Claude does
    required: true
  allowed-tools:
    description: >-
      Tools allowed on top of reading and editing files, Gradle and local git (comma-separated, Claude Code syntax),
      e.g. Bash(git push:*) or Bash(gh pr comment:*)
    default: ""
  allowed-bots:
    description: Bots whose events may start Claude (comma-separated logins)
    default: ""
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`
    default: ""
  anthropic-api-key:
    description: ANTHROPIC_API_KEY, instead of a subscription
    default: ""
  app-client-id:
    description: The bot App's client ID
    required: true
  app-private-key:
    description: The bot App's private key
    required: true
outputs:
  done:
    description: '"true" when Claude ran and finished'
    value: ${{ steps.run.outputs.conclusion == 'success' || steps.opus.outputs.conclusion == 'success' }}
  error:
    description: Why Claude couldn't finish, when it ran and failed
    value: ${{ steps.why.outputs.reason }}
  out-of-credit:
    description: '"true" when Claude failed because the plan''s usage limit or the API credit ran out'
    value: ${{ steps.why.outputs.out-of-credit == 'true' }}
  response:
    description: Claude's last answer, in Markdown, when it finished
    value: ${{ steps.answer.outputs.text }}
runs:
  using: composite
  steps:
    - name: Check for a Claude credential
      id: auth
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        if [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret, so Claude doesn't run (app-machinery docs/01-once-per-account.md)."
        fi
    - if: steps.auth.outputs.ready == 'true'
      uses: ./.machinery/.github/actions/setup-build
    # Read-only: Claude pushes and posts nothing, and its Gradle runs execute the build's code, so a write token here
    # would let an agent steered by what it read push or post anything
    - id: token
      if: steps.auth.outputs.ready == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: read
    # Claude Code's arguments but the model, the same for both runs below. The effort is explicit because Opus's own
    # default is only "medium".
    - id: args
      if: steps.auth.outputs.ready == 'true'
      shell: bash
      env:
        ARGS: >-
          --effort xhigh --permission-mode acceptEdits
          --allowedTools "Bash(./gradlew:*),Bash(.machinery/.github/scripts/check-forbidden-names.sh:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git switch:*),Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*)"
          ${{ inputs.allowed-tools && format('--allowedTools "{0}"', inputs.allowed-tools) || '' }}
      run: echo "common=$ARGS" >> "$GITHUB_OUTPUT"
    # A failure is settled below: Opus may take over, and the last step fails the action when no run finished
    - id: run
      if: steps.auth.outputs.ready == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ steps.token.outputs.token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        # ./gradlew check takes longer than Claude Code's default two-minute limit for a command. Commands never run in
        # the background: a run ends when Claude's turn does, killing a check still running there with the work not
        # yet pushed (Fable did that twice on one issue, losing its commits with the runner)
        settings: |
          {"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "2700000",
                   "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}
        # "best" is Fable on a plan that has it, Opus otherwise; a plan without Fable once got Fable anyway, which
        # refused every run in 2 seconds, so check a run after a plan change (and set --model opus if that is back).
        # The fallback only covers an overloaded or unavailable model, not a refused one or a used-up quota: the
        # next steps cover the best model's own credit running out.
        claude_args: --model best --fallback-model opus ${{ steps.args.outputs.common }}
        prompt: ${{ inputs.prompt }}
    # Fable has a usage credit of its own, which can run out before the plan's: Claude Code then stops at once with
    # "You're out of usage credits. Switch to another model to continue." Only the run's result is read, not what
    # Claude read or wrote on the way, which could quote that sentence.
    - id: spent
      if: ${{ !cancelled() && steps.run.outcome == 'failure' }}
      shell: bash
      run: |
        file="$RUNNER_TEMP/claude-execution-output.json"
        [ -s "$file" ] || exit 0
        result="$(jq -r '([.[] | select(.type == "result")] | last | .result) // ""' "$file")"
        if printf '%s' "$result" | grep -qi 'switch to another model'; then
          echo "::notice::The best model's usage credit ran out, so Opus takes over."
          echo "opus=true" >> "$GITHUB_OUTPUT"
        fi
    - id: opus
      if: ${{ !cancelled() && steps.spent.outputs.opus == 'true' }}
      continue-on-error: true
      uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ steps.token.outputs.token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        settings: |
          {"env": {"BASH_DEFAULT_TIMEOUT_MS": "1800000", "BASH_MAX_TIMEOUT_MS": "2700000",
                   "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}
        claude_args: --model opus ${{ steps.args.outputs.common }}
        prompt: ${{ inputs.prompt }}
    # Claude's last word, which callers post (a CI fix code can't make, say)
    - id: answer
      if: steps.run.outcome == 'success' || steps.opus.outcome == 'success'
      shell: bash
      run: |
        file="$RUNNER_TEMP/claude-execution-output.json"
        [ -s "$file" ] || exit 0
        text="$(jq -r '([.[] | select(.type == "result")] | last | .result) // ""' "$file" | head -c 60000)"
        delimiter="EOF-$(openssl rand -hex 8)"
        printf 'text<<%s\n%s\n%s\n' "$delimiter" "$text" "$delimiter" >> "$GITHUB_OUTPUT"
    # The action's log hides why Claude failed (show_full_output would print every tool result too), but its execution
    # file keeps Claude Code's last word: that reason becomes the run's error, which callers post
    - id: why
      if: ${{ !cancelled() && steps.run.outcome == 'failure' && steps.opus.outcome != 'success' }}
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        file="$RUNNER_TEMP/claude-execution-output.json"
        reason=""
        if [ -s "$file" ]; then
          reason="$(jq -r '
            ([.[] | select(.type == "result")] | last) as $result
            | ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last) as $said
            | [$result.result, (($result.errors // []) | join(", ")), $said]
            | map(select(type == "string" and length > 0)) | first // ""
          ' "$file" | tr '\r\n' '  ' | cut -c1-500)"
        fi
        # Not "${reason:-...}": bash reads an apostrophe in that default as an opening quote
        [ -n "$reason" ] || reason="Claude Code stopped without giving a reason: see this step's log."
        echo "::error title=Claude couldn't finish::${reason//%/%25}"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        if printf '%s' "$reason" | "$SCRIPTS/out-of-credit.sh"; then
          echo "out-of-credit=true" >> "$GITHUB_OUTPUT"
        fi
    # The runs above may fail without failing the action, so that Opus can take over: it fails here when none finished
    - name: Fail when Claude couldn't finish
      if: ${{ !cancelled() && steps.run.outcome == 'failure' && steps.opus.outcome != 'success' }}
      shell: bash
      run: exit 1
