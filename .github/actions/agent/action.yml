name: Agent
description: >-
  Gives a task to an AI agent on the checked-out branch: Claude Code first, the Copilot CLI when Claude can't finish
  (no credential, a used-up quota, an error) or when `engine` asks for Copilot. The agent commits locally, and this
  action hands its commits over as a bundle (`artifact`): the job holds the workflow's read-only token and nothing of
  the bot App's, and a job where no agent ran publishes them (.github/actions/publish-commits). An agent that finishes
  without committing answers instead: `response` says why, for the caller to tell the owner. Expects the app checked
  out without credentials, and the machinery checked out in .machinery.
inputs:
  prompt:
    description: The task
    required: true
  engine:
    description: '"claude" (Claude, then Copilot) or "copilot" (Copilot only)'
    default: claude
  allowed-commands:
    description: >-
      Shell commands allowed on top of the usual ones (Gradle, local git, reading files), comma-separated; never one
      that reads issues, pull requests or comments (AGENTS.md)
    default: ""
  web:
    description: '"true" to let the agent read web pages (release notes, migration guides)'
    default: "false"
  allowed-bots:
    description: Bots whose events may start Claude (comma-separated logins), on top of Dependabot and GitHub Actions
    default: ""
  artifact:
    description: The name of the artifact that takes the agent's commits to the job that publishes them
    required: true
  claude-code-oauth-token:
    description: CLAUDE_CODE_OAUTH_TOKEN
    default: ""
  anthropic-api-key:
    description: ANTHROPIC_API_KEY
    default: ""
  copilot-github-token:
    description: COPILOT_GITHUB_TOKEN
    default: ""
outputs:
  done:
    description: '"true" when an agent finished'
    value: ${{ steps.claude.outputs.done == 'true' || steps.copilot.outputs.done == 'true' }}
  engine:
    description: The agent that finished, if one did
    value: ${{ steps.claude.outputs.done == 'true' && 'claude' || (steps.copilot.outputs.done == 'true' && 'copilot' || '') }}
  response:
    description: The agent's last answer
    value: ${{ steps.claude.outputs.response || steps.copilot.outputs.response }}
  error:
    description: Why no agent finished
    value: ${{ steps.copilot.outputs.error || steps.claude.outputs.error }}
  out-of-credit:
    description: '"true" when the agents that ran had no quota left'
    value: ${{ steps.claude.outputs.out-of-credit == 'true' && steps.copilot.outputs.done != 'true' && (steps.copilot.outputs.out-of-credit == 'true' || steps.copilot.outputs.error == '') }}
  commits:
    description: How many commits the agent hands over ("0" or empty when there are none to publish)
    value: ${{ steps.bundle.outputs.commits }}
runs:
  using: composite
  steps:
    - id: start
      name: Start
      shell: bash
      env:
        COMMANDS: ${{ inputs.allowed-commands }}
        WEB: ${{ inputs.web }}
      run: |
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        grep -qxF ".machinery/" .git/info/exclude || echo ".machinery/" >> .git/info/exclude
        tools=""
        [ "$WEB" = "true" ] && tools="WebFetch"
        IFS=',' read -ra commands <<< "$COMMANDS"
        for command in "${commands[@]}"; do
          command="$(echo "$command" | xargs)"
          [ -n "$command" ] && tools="${tools:+$tools,}Bash($command:*)"
        done
        echo "claude-tools=$tools" >> "$GITHUB_OUTPUT"
    - id: claude
      if: inputs.engine != 'copilot'
      continue-on-error: true
      uses: ./.machinery/.github/actions/claude
      with:
        prompt: ${{ inputs.prompt }}
        allowed-tools: ${{ steps.start.outputs.claude-tools }}
        allowed-bots: dependabot[bot],github-actions[bot]${{ inputs.allowed-bots && format(',{0}', inputs.allowed-bots) || '' }}
        claude-code-oauth-token: ${{ inputs.claude-code-oauth-token }}
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
    # Copilot starts from where Claude started, without whatever Claude left half done
    - name: Hand over to Copilot
      if: steps.claude.outputs.done != 'true'
      shell: bash
      env:
        START: ${{ steps.start.outputs.sha }}
      run: |
        git reset --hard --quiet "$START"
        git config user.name "Copilot"
        git config user.email "198982749+Copilot@users.noreply.github.com"
    - id: copilot
      if: steps.claude.outputs.done != 'true'
      continue-on-error: true
      uses: ./.machinery/.github/actions/copilot
      with:
        prompt: ${{ inputs.prompt }}
        allowed-commands: ${{ inputs.allowed-commands }}
        copilot-github-token: ${{ inputs.copilot-github-token }}
    - id: bundle
      if: steps.claude.outputs.done == 'true' || steps.copilot.outputs.done == 'true'
      uses: ./.machinery/.github/actions/bundle-commits
      with:
        start: ${{ steps.start.outputs.sha }}
        name: ${{ inputs.artifact }}
