name: Upgrade agent

# After a major dependency update merges (Dependabot's, labelled `major-update` by automerge.yml), an AI agent adopts
# what the new version recommends: it replaces deprecated APIs and takes up recommended ones, without changing what the
# app does, in a pull request that merges by itself once CI is green. With nothing worth changing, it says so on the
# merged pull request.
#
# The app's caller runs this when a pull request is closed: docs/02-new-app.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  upgrade:
    name: Adopt the new versions
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'major-update')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - id: agent
        uses: ./.machinery/.github/actions/agent
        with:
          engine: ${{ contains(github.event.pull_request.labels.*.name, 'copilot') && 'copilot' || 'claude' }}
          web: "true"
          allowed-commands: gh pr view,gh release view
          allowed-bots: ${{ vars.GH_APP_LOGIN }}
          branch: agent/upgrade-${{ github.event.pull_request.number }}
          open-pull-request: "true"
          body: >-
            Adopts what the major update merged in #${{ github.event.pull_request.number }} recommends; it merges by
            itself once CI is green.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          copilot-github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          app-client-id: ${{ vars.GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          prompt: |
            You are the app's upgrade agent. The major dependency update "${{ github.event.pull_request.title }}"
            (pull request #${{ github.event.pull_request.number }}, `gh pr view ${{ github.event.pull_request.number }}`)
            was merged, and the build passes. Read AGENTS.md first: it holds the rules for AI agents.

            1. From the pull request's description, find each updated dependency with its old and new version.
            2. Read the release notes, changelog or migration guide between those versions.
            3. Replace the APIs the new version deprecates, and take up recommended new APIs or configuration where
               they fit naturally. Don't change what the app does, and don't refactor unrelated code.
            4. Run the app's checks (`./gradlew check`) until they pass. Wait for every command to finish: whatever
               isn't committed when you stop is lost.
            5. Commit your changes; the first commit's subject becomes the pull request's title, e.g.
               `refactor(deps): adopt the new Compose animation APIs`. Never put an issue number in a commit message.
               Push nothing: the workflow opens the pull request.
            6. End with a short answer: each change with a link to the changelog entry behind it, or why nothing was
               worth changing.
      - id: token
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: write
      - name: Answer on the merged pull request
        if: steps.token.outcome == 'success' && (steps.agent.outputs.done == 'true' || steps.agent.outputs.error != '')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ANSWER: "${{ steps.agent.outputs.response || format('The upgrade agent could not run: {0}', steps.agent.outputs.error) }}"
          OPENED: ${{ steps.agent.outputs.pull-request }}
        run: |
          body="$ANSWER"
          [ -z "$OPENED" ] || body="$(printf '%s\n\n%s' "$ANSWER" "$OPENED")"
          gh pr comment "$NUMBER" --body "$body"
