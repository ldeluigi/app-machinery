name: iOS

# Builds the app for iPhones and tests it on a simulator: the Kotlin tests on iOS, then the Xcode project (generated by
# XcodeGen from the app's iosApp/project.yml) with its UI tests. The screenshots and screen recordings the UI tests keep,
# and any crash report, are the run's `ios-screenshots` artifact.
#
# macOS minutes cost ten times Linux ones on a private repository, so the app's caller runs this on default-branch
# pushes that touch code, on pull requests labelled `ios`, and by hand: see docs/02-new-app.md.

on:
  workflow_call:
    inputs:
      ios-app:
        description: The folder of the iOS app project
        type: string
        default: iosApp
      label:
        description: The label that asks for this check on a pull request
        type: string
        default: ios

permissions:
  contents: read

jobs:
  build:
    name: Build and test for iOS
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, inputs.label)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: ${{ inputs.ios-app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - uses: ./.machinery/.github/actions/setup-build
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Pick a simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name] | first // "iPhone 17"')"
          echo "Testing on $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"
      - name: Compile for iPhones and test on the simulator
        env:
          SIMULATOR: ${{ steps.simulator.outputs.name }}
        run: ./gradlew compileKotlinIosArm64 iosSimulatorArm64Test "-Pios.simulator=$SIMULATOR" --continue
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd "$APP" && xcodegen generate
      - name: Build the app and run its UI tests on the simulator
        env:
          SIMULATOR: ${{ steps.simulator.outputs.name }}
        run: |
          xcodebuild test \
            -project "$APP/App.xcodeproj" -scheme App \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -resultBundlePath "$APP/build/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Take out the screenshots
        if: always()
        run: |
          [ -d "$APP/build/tests.xcresult" ] || exit 0
          xcrun xcresulttool export attachments --path "$APP/build/tests.xcresult" --output-path "$APP/build/screenshots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ${{ inputs.ios-app }}/build/screenshots/
          if-no-files-found: ignore
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-reports
          path: |
            **/build/reports/
            ${{ inputs.ios-app }}/build/tests.xcresult/
