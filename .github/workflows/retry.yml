name: Retry

# The first line of self-healing, two jobs the app's caller picks by its triggers:
# - after a failed automation run (workflow_run), re-runs its failed jobs once, which fixes network hiccups, registry
#   errors and lost runners for free; if the re-run fails too, the CI-fix agent (agents.yml) takes over;
# - on Monday (schedule), gives the AI agents another go at the issues they ran out of credit for, by taking the
#   "retry next week" label off as the bot App (changes made with GITHUB_TOKEN start no workflows): the issue agent
#   starts again on each.

on:
  workflow_call:
    secrets:
      GH_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  rerun:
    name: Re-run failed jobs once
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.head_branch == github.event.repository.default_branch ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
       startsWith(github.event.workflow_run.head_branch, 'machinery/') ||
       startsWith(github.event.workflow_run.head_branch, 'agent/') ||
       startsWith(github.event.workflow_run.head_branch, 'bot/'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

  issues:
    name: Retry the issues
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Take the "retry next week" label off
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issues="$(gh issue list --label "retry next week" --state open --limit 100 --json number --jq '.[].number')"
          for issue in $issues; do
            gh issue edit "$issue" --remove-label "retry next week"
            echo "Retrying #$issue"
          done
