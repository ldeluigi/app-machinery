name: CI

# An app's whole pipeline, in one workflow: the checks, the Android and iOS builds, then the release.
#
# Every pull request and every push:
# - Conventional commits: every commit message, as commitlint reads them (releases are made from them);
# - Repository rules: no forbidden name (config/forbidden-names.txt), no issue number in a commit message, every action
#   pinned to a commit SHA;
# - Build and check: `./gradlew check` and a debug build (tests, static analysis, lint, licences, translations).
# Then, where they are worth their time:
# - Emulator smoke test: the instrumented tests on an Android emulator, on the default branch, Gradle dependency updates
#   and machinery refreshes, where runtime regressions are likeliest;
# - Build and test for iOS: the Kotlin tests on an iOS simulator, the Xcode build and its UI tests, on default-branch
#   pushes that touch code, pull requests labelled `ios`, and runs started by hand (macOS minutes cost ten times Linux
#   ones on a private repository). Its screenshots, screen recording and any crash report are the `ios-screenshots`
#   artifact.
# On the default branch, once all of those passed:
# - Version, build and GitHub Release: semantic-release decides from the Conventional Commits whether to release and
#   which version, builds and signs the app for it (a failed build stops before tagging), tags vX.Y.Z and makes the
#   GitHub Release; the release tool turns the changelogs of this release and the ones before it into Google Play's
#   notes, which Claude Code translates into the app's languages. Only the newest commit on the branch releases: an
#   older run that sees newer commits leaves the release to theirs.
# - Upload to Google Play, with the notes in the store listing's languages and the in-app update priority (once the
#   `PLAY_TRACK` variable is set);
# - Google Play listing graphics: the app's StoreArtTest draws them, and the ones that changed are replaced. A run
#   started by hand with `store-listing` does only this, on the default branch.
# - Upload to TestFlight: the iOS app of the release, archived and signed by Apple's cloud signing with the App Store
#   Connect API key, for the testers (once the `APPLE_TEAM_ID` variable is set).
#
# The app's .github/workflows/ci.yml calls this one: see docs/02-new-app.md.

on:
  workflow_call:
    inputs:
      build:
        description: The Gradle tasks that build and check the app
        type: string
        default: check assembleDebug --continue
      android-app:
        description: The Android application module
        type: string
        default: androidApp
      emulator-api-level:
        description: The Android version the smoke test runs on
        type: number
        default: 35
      ios-app:
        description: The folder of the iOS app project
        type: string
        default: iosApp
      ios-label:
        description: The label that asks for the iOS build on a pull request
        type: string
        default: ios
      about:
        description: 'What the app is, for the translators of the notes: "a party game in which ..."'
        type: string
        default: ""
      scope-notes:
        description: 'The app''s own maintenance scopes, one "scope: friendly line" each, e.g. "catalog: Refreshed the songs."'
        type: string
        default: ""
      translations:
        description: The app's Compose resources, whose values-* folders give its languages
        type: string
        default: composeApp/src/commonMain/composeResources
      art:
        description: The Gradle tasks that draw the store listing's graphics
        type: string
        default: ":composeApp:testAndroidHostTest --tests *StoreArtTest --rerun"
      art-dir:
        description: Where they draw them
        type: string
        default: composeApp/build/store-art
      store-listing:
        description: Only replace the store listing's graphics (a run started by hand on the default branch)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.ios.outputs.run }}
    steps:
      # Read when the job runs, not from the event: a re-run sees a label added since
      - id: ios
        name: Whether iOS builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ inputs.ios-label }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          LISTING: ${{ inputs.store-listing }}
        run: |
          run=false
          case "$EVENT" in
            workflow_dispatch)
              [ "$LISTING" = "true" ] || run=true ;;
            pull_request)
              gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qxF "$LABEL" && run=true ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                run=true
              elif gh api "repos/$GH_REPO/compare/$BEFORE...$SHA" --paginate --jq '.files[].filename' |
                grep -qE '\.kts?$|^gradle/|^gradle\.properties$|^\.java-version$|^iosApp/|/composeResources/'; then
                run=true
              fi ;;
          esac
          echo "iOS builds: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  commits:
    name: Conventional commits
    if: ${{ !inputs.store-listing }}
    runs-on: ubuntu-latest
    # Listing a pull request's commits needs pull request access in a private repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The machinery at the version the app calls (this workflow's own commit), for its scripts and actions
      - &find-machinery
        id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - &checkout-machinery
        name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .machinery/.commitlintrc.yml

  repository-rules:
    name: Repository rules
    if: ${{ !inputs.store-listing }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *find-machinery
      - *checkout-machinery
      - name: The revisions to check
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo ".machinery/" >> .git/info/exclude
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "range=$BASE..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=-1 HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Forbidden names in files and commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          if [ "$RANGE" = "-1 HEAD" ]; then
            .machinery/.github/scripts/check-forbidden-names.sh
          else
            .machinery/.github/scripts/check-forbidden-names.sh "$RANGE"
          fi
      # A "Closes #12" in a commit ends up in the release notes and the stores' "What's new": the pull request's
      # description closes the issue instead
      - name: No issue numbers in commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
        # Word splitting is wanted: "-1 HEAD" is two arguments
        run: |
          # shellcheck disable=SC2086
          .machinery/.github/scripts/check-issue-references.sh $RANGE
      - name: Actions pinned to commit SHAs
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11

  build:
    name: Build and check
    if: ${{ !inputs.store-listing }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - &checkout-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *find-machinery
      - *checkout-machinery
      - &setup-build
        uses: ./.machinery/.github/actions/setup-build
      - name: Static analysis, tests, lint and licences
        env:
          TASKS: ${{ inputs.build }}
        # Word splitting is wanted: the tasks are separate arguments
        run: |
          # shellcheck disable=SC2086
          ./gradlew $TASKS
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 14

  emulator-smoke:
    name: Emulator smoke test
    needs: build
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.head_ref, 'dependabot/gradle/') ||
      startsWith(github.head_ref, 'machinery/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - *checkout-app
      - *find-machinery
      - *checkout-machinery
      - *setup-build
      # The emulator wants 1.2 times its data partition free (7.4 GB by default), more than the runner has left
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APP: ${{ inputs.android-app }}
        with:
          api-level: ${{ inputs.emulator-api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3G
          # Gradle reports success when the app couldn't even be installed, so check that a test really ran
          script: |
            ./gradlew ":$APP:connectedDebugAndroidTest"
            grep -q 'tests="[1-9]' "$APP"/build/outputs/androidTest-results/connected/debug/TEST-*.xml
      - name: Upload the test report and logcat
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-reports
          path: |
            ${{ inputs.android-app }}/build/reports/androidTests/
            ${{ inputs.android-app }}/build/outputs/androidTest-results/
          retention-days: 14

  ios:
    name: Build and test for iOS
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP: ${{ inputs.ios-app }}
    steps:
      - *checkout-app
      - *find-machinery
      - *checkout-machinery
      - *setup-build
      # Kotlin/Native's toolchain and library caches belong to the Kotlin version (the machinery's catalog names it), so
      # they survive the app's other changes
      - id: kotlin
        name: Find the Kotlin version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' .machinery/gradle/libs.versions.toml)"
          [ -n "$version" ] || { echo "::error::The machinery's catalog names no Kotlin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: Pick a simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name] | first // "iPhone 17"')"
          echo "Testing on $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"
      - name: Compile for iPhones and test on the simulator
        env:
          SIMULATOR: ${{ steps.simulator.outputs.name }}
        run: ./gradlew compileKotlinIosArm64 iosSimulatorArm64Test "-Pios.simulator=$SIMULATOR" --continue
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd "$APP" && xcodegen generate
      - name: Build the app and run its UI tests on the simulator
        env:
          SIMULATOR: ${{ steps.simulator.outputs.name }}
        run: |
          xcodebuild test \
            -project "$APP/App.xcodeproj" -scheme App \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -resultBundlePath "$APP/build/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Take out the screenshots
        if: always()
        run: |
          [ -d "$APP/build/tests.xcresult" ] || exit 0
          xcrun xcresulttool export attachments --path "$APP/build/tests.xcresult" --output-path "$APP/build/screenshots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ${{ inputs.ios-app }}/build/screenshots/
          if-no-files-found: ignore
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-reports
          path: |
            **/build/reports/
            ${{ inputs.ios-app }}/build/tests.xcresult/

  release:
    name: Version, build and GitHub Release
    needs: [commits, repository-rules, build, emulator-smoke, ios]
    # A template repository (app-template) builds and tests as an app does, but never releases: its apps do.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      !github.event.repository.is_template &&
      needs.commits.result == 'success' && needs.repository-rules.result == 'success' &&
      needs.build.result == 'success' && needs.emulator-smoke.result == 'success' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    # The build and the notes' translations
    timeout-minutes: 65
    # One release at a time; a newer commit's run waiting replaces an older one's, since it releases them all
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      priority: ${{ steps.play-notes.outputs.priority }}
      # From app.id in the app's gradle.properties, as the build reads it
      app-id: ${{ steps.play-notes.outputs.app-id }}
    steps:
      - id: gate
        name: Release only if this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Newer commits are on $BRANCH: the run of the newest one releases them with this one."
          fi
      - if: steps.gate.outputs.newest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: machinery
        name: Find the machinery
        if: steps.gate.outputs.newest == 'true'
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        if: steps.gate.outputs.newest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - if: steps.gate.outputs.newest == 'true'
        uses: ./.machinery/.github/actions/setup-build
      - name: Configure semantic-release
        if: steps.gate.outputs.newest == 'true'
        env:
          APP: ${{ inputs.android-app }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo ".machinery/" >> .git/info/exclude
          if [ ! -f .releaserc.yml ]; then
            sed -e "s|@APP@|$APP|g" -e "s|@BRANCH@|$BRANCH|g" .machinery/release/releaserc.yml > .releaserc.yml
            echo ".releaserc.yml" >> .git/info/exclude
          fi
      - name: Decode the upload key
        if: steps.gate.outputs.newest == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - id: semantic
        name: semantic-release
        if: steps.gate.outputs.newest == 'true'
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        # The preset stays on 9.x: semantic-release 25's notes generator bundles conventional-changelog-writer 8,
        # and preset 10 needs writer 9 ("Missing helper"). Move them together, after a local dry run.
        # @semantic-release/github is pinned over the action's bundled 12.0.6, whose asset uploads fail on Node 24.17+
        # ("invalid content-length header") after tagging, leaving a draft release (fixed in 12.0.9).
        # The action warns "No package.json file found": expected, the config lists its plugins without
        # @semantic-release/npm. Its skip_npm_plugin input would replace that list, so it stays unset.
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/exec@7.1.0
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@9.3.1
        # Signing only here: Gradle in any other step would see the keystore and want its passwords too.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      # Right after the build that signs: nothing else in this job needs the key.
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      # Claude Code translates the notes, on the agents' Claude credential. Without one, or if Claude Code can't be
      # installed or can't translate, the notes stay in English.
      - name: Install Claude Code, to translate the notes
        if: steps.semantic.outputs.new_release_published == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then
            npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.303
          else
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret, so Google Play's notes stay in English."
          fi
      - name: Build the release tool
        if: steps.semantic.outputs.new_release_published == 'true'
        run: ./.machinery/gradlew -p .machinery :tools:release:installDist --quiet
      - id: play-notes
        name: Google Play notes, update priority and app id
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          RELEASE_NOTES: ${{ steps.semantic.outputs.new_release_notes }}
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          LAST_RELEASE_VERSION: ${{ steps.semantic.outputs.last_release_version }}
          APP_ABOUT: ${{ inputs.about }}
          SCOPE_NOTES: ${{ inputs.scope-notes }}
          TRANSLATIONS: ${{ inputs.translations }}
          # The earlier releases' changelogs
          GH_TOKEN: ${{ github.token }}
          # Claude Code's credential, for the translations
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .machinery/tools/release/build/install/release/bin/release
      - name: Keep the bundle for the Play upload
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            ${{ inputs.android-app }}/build/outputs/bundle/release/${{ inputs.android-app }}-release.aab
            ${{ inputs.android-app }}/build/outputs/mapping/release/mapping.txt
            whatsnew/
          retention-days: 30

  play:
    name: Upload to Google Play
    needs: release
    # PLAY_TRACK switches the upload on: it stays unset until the app's first bundle is on Play (docs/02-new-app.md),
    # since uploads to an app Play doesn't know yet only fail.
    # !cancelled(): without a status function, GitHub adds success(), which fails when any job upstream was skipped,
    # like the iOS build of a push that changes no code: the release succeeded, and this job was skipped all the same.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' && vars.PLAY_TRACK != '' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE: release/${{ inputs.android-app }}/build/outputs/bundle/release/${{ inputs.android-app }}-release.aab
      MAPPING: release/${{ inputs.android-app }}/build/outputs/mapping/release/mapping.txt
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release
      - id: wif
        name: Authenticate with Workload Identity Federation
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - &google-key
        id: key
        name: Authenticate with the service account key
        if: vars.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      # Google Play takes notes only in the store listing's languages (Store listings → the listing → Manage
      # translations), so the others are left out. When the listing can't be read, the notes go in English only.
      - name: Keep the notes in the store listing's languages
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.key.outputs.access_token }}
          PACKAGE: ${{ needs.release.outputs.app-id }}
        run: |
          edits="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits"
          play() { curl -fsS -H "Authorization: Bearer $PLAY_ACCESS_TOKEN" -H "Content-Type: application/json" "$@"; }
          languages=""
          if edit="$(play -X POST -d '{}' "$edits" | jq -er .id)"; then
            languages="$(play "$edits/$edit/listings" | jq -r '.listings[]?.language')" || languages=""
            play -X DELETE "$edits/$edit" > /dev/null || true
          fi
          if [ -z "$languages" ]; then
            echo "::warning::Couldn't read the store listing's languages, so Google Play's notes go in English only."
          fi
          for file in release/whatsnew/whatsnew-*; do
            language="${file##*/whatsnew-}"
            if [ "$language" != en-US ] && ! grep -qxF "$language" <<< "$languages"; then
              rm "$file"
            fi
          done
          echo "Google Play's notes go in: $(find release/whatsnew -name 'whatsnew-*' -printf '%f\n' | sed 's/^whatsnew-//' | sort | paste -sd ' ')"
      - name: Upload (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.wif.outputs.credentials_file_path }}
          packageName: ${{ needs.release.outputs.app-id }}
          releaseFiles: ${{ env.BUNDLE }}
          mappingFile: ${{ env.MAPPING }}
          whatsNewDirectory: release/whatsnew
          tracks: ${{ vars.PLAY_TRACK }}
          status: completed
          inAppUpdatePriority: ${{ needs.release.outputs.priority }}
      - name: Upload (service account key)
        if: vars.GCP_WIF_PROVIDER == ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.release.outputs.app-id }}
          releaseFiles: ${{ env.BUNDLE }}
          mappingFile: ${{ env.MAPPING }}
          whatsNewDirectory: release/whatsnew
          tracks: ${{ vars.PLAY_TRACK }}
          status: completed
          inAppUpdatePriority: ${{ needs.release.outputs.priority }}

  listing:
    name: Google Play listing graphics
    # After the upload, which commits its own edit of the app: one edit at a time. Or alone, from a run started by
    # hand on the default branch with `store-listing`.
    needs: play
    if: >-
      !cancelled() && vars.PLAY_TRACK != '' &&
      (needs.play.result == 'success' ||
       (inputs.store-listing && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout-app
      - *find-machinery
      - *checkout-machinery
      - *setup-build
      - name: Draw the icon, the feature graphic and the screenshots
        env:
          TASKS: ${{ inputs.art }}
        # Word splitting is wanted: the tasks and options are separate arguments
        run: |
          # shellcheck disable=SC2086
          ./gradlew $TASKS
      - id: wif
        name: Authenticate with Workload Identity Federation
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - *google-key
      - name: Build the release tool
        run: ./.machinery/gradlew -p .machinery :tools:release:installDist --quiet
      - name: Replace the graphics that changed
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.key.outputs.access_token }}
          ART: ${{ inputs.art-dir }}
        run: .machinery/tools/release/build/install/release/bin/upload-listing "$ART"

  testflight:
    name: Upload to TestFlight
    needs: release
    # APPLE_TEAM_ID switches the upload on: it stays unset until the app's record exists in App Store Connect
    # (docs/02-new-app.md), since uploads for an app App Store Connect doesn't know only fail.
    # !cancelled(): without a status function, GitHub adds success(), which fails when any job upstream was skipped,
    # like the iOS build of a push that changes no code: the release succeeded, and this job was skipped all the same.
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' && vars.APPLE_TEAM_ID != '' }}
    runs-on: macos-latest
    environment: release
    # The release build of the Kotlin framework, then the archive
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP: ${{ inputs.ios-app }}
      # The team signs, and the version is the release's, in every Gradle run (Xcode's included)
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - *find-machinery
      - *checkout-machinery
      - *setup-build
      # Kotlin/Native's toolchain and library caches belong to the Kotlin version (the machinery's catalog names it), so
      # they survive the app's other changes
      - id: kotlin
        name: Find the Kotlin version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' .machinery/gradle/libs.versions.toml)"
          [ -n "$version" ] || { echo "::error::The machinery's catalog names no Kotlin version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd "$APP" && xcodegen generate
      # Unsigned: a signed archive needs a development certificate and profile, which Xcode can't make for a team
      # without registered devices (testers install through TestFlight, so none is), and a new runner would make a new
      # certificate each time, until Apple's limit. The app has no entitlements of its own to carry over.
      - name: Archive the app
        run: |
          xcodebuild archive \
            -project "$APP/App.xcodeproj" -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      # Apple's cloud signing: with the App Store Connect API key (Admin access), Xcode signs the export with the
      # team's cloud-managed distribution certificate and an App Store profile it makes, so no signing material is kept
      # anywhere.
      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign it for the App Store and upload it to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
