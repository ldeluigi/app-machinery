name: Self CI

# The machinery's own checks: every workflow and action is valid (actionlint, with shellcheck on their scripts), every
# action is pinned to a commit SHA, commit messages are Conventional Commits, and the plugins and tools build and pass
# their tests and static analysis.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest
          ./actionlint -color
      - name: Composite actions' scripts
        run: shellcheck .github/scripts/*.sh
      - name: Actions pinned to commit SHAs
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11

  build:
    name: Plugins and tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build, test and check
        run: ./gradlew build --continue
      - name: The plugins publish
        run: ./gradlew -p plugins publish
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 14

  # The canary: the template, an app as small as can be, builds and passes its checks with the plugins of this change
  template:
    name: The template builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/app-template
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check the template, and compile it for iOS
        working-directory: app
        run: ./gradlew check compileKotlinIosSimulatorArm64 --continue "-Pmachinery.local=$GITHUB_WORKSPACE"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-reports
          path: app/**/build/reports/
          retention-days: 14
