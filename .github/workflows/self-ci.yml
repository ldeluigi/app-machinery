name: Self CI

# The machinery's own pipeline. Every change: every workflow and action is valid (actionlint, with shellcheck on their
# scripts), every action is pinned to a commit SHA, commit messages are Conventional Commits, the plugins and tools
# build and pass their tests and static analysis, and the template (an app as small as can be) builds and passes its
# checks with the plugins of this change. Then, on main: semantic-release tags vX.Y.Z from the Conventional Commits and
# makes the GitHub Release, the plugins of that version join the Maven repository on the machinery's GitHub Pages
# (the `gh-pages` branch, under maven/), next to every earlier version, and Dependabot offers the release to every app.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest
          ./actionlint -color
      - name: Composite actions' scripts
        run: shellcheck .github/scripts/*.sh
      - name: Actions pinned to commit SHAs
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11

  build:
    name: Plugins and tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build, test and check
        run: ./gradlew build --continue
      - name: The plugins build, pass their checks and publish
        run: ./gradlew -p plugins check publish --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 14

  # The canary: the template, an app as small as can be, builds and passes its checks with the plugins of this change
  template:
    name: The template builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/app-template
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Check the template, build its release (R8), and compile it for iOS
        working-directory: app
        run: ./gradlew check :androidApp:assembleRelease compileKotlinIosSimulatorArm64 --continue "-Pmachinery.local=$GITHUB_WORKSPACE"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-reports
          path: app/**/build/reports/
          retention-days: 14

  release:
    name: Version and GitHub Release
    needs: [commits, workflows, build, template]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One release at a time: a newer commit's run waiting replaces an older one's
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plugins:
    name: Publish the plugins
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      # The site keeps every version published so far: Gradle merges the new one into its metadata
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Publish into the site
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: ./gradlew -p plugins publish "-Pmachinery.version=$VERSION" "-Pmachinery.repository=$GITHUB_WORKSPACE/site/maven"
      - name: Push the site
        env:
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "chore: publish the plugins $VERSION"
          git push
