name: Auto-merge

# Turns on GitHub's auto-merge for the pull requests no human needs to review: GitHub merges them once the required
# checks pass, and a red one goes to the CI-fix agent instead.
# - Dependabot's: a major update gets the `major-update` label (the upgrade agent adopts what it brings once merged),
#   and an update of build-only dependencies (config/build-only-deps.txt, regular expressions of `group:artifact`) is
#   squashed as `build(deps)`, which releases nothing, instead of `fix(deps)`.
# - The bot App's, labelled `automerge` (catalogue refreshes, machinery refreshes, agents' work).
#
# The merge is turned on with the bot App's token, not GITHUB_TOKEN, whose pushes start no workflows: the merge must
# start the release. Workflows Dependabot starts read only Dependabot secrets, so GH_APP_PRIVATE_KEY is stored as both
# an Actions and a Dependabot secret.

on:
  workflow_call:
    inputs:
      build-only-deps:
        description: The list of build-only dependencies
        type: string
        default: config/build-only-deps.txt

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # fetch-metadata lists the pull request's commits, which needs pull request access in a private repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Label major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh label create major-update --color B60205 --description "Major dependency update" --force
          gh pr edit "$PR_URL" --add-label major-update
      - name: Choose the squash commit subject
        id: subject
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
          TITLE: ${{ github.event.pull_request.title }}
          LIST: ${{ inputs.build-only-deps }}
        run: |
          subject="$TITLE"
          if [ "$ECOSYSTEM" = "gradle" ] && [ -f "$LIST" ]; then
            patterns="$(grep -vE '^\s*(#|$)' "$LIST")"
            build_only=true
            IFS=',' read -ra deps <<< "$DEPENDENCIES"
            for dep in "${deps[@]}"; do
              dep="$(echo "$dep" | xargs)"
              if ! grep -qE -f <(echo "$patterns") <<< "$dep"; then build_only=false; fi
            done
            if [ "$build_only" = true ]; then subject="build(deps):${TITLE#*:}"; fi
          fi
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SUBJECT: ${{ steps.subject.outputs.subject }}
        run: gh pr merge --auto --squash --subject "$SUBJECT" "$PR_URL"

  bot:
    name: Bot pull requests
    if: >-
      github.event.pull_request.user.login == vars.GH_APP_LOGIN &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
