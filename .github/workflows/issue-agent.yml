name: Issue agent

# Routes the issues that need no human to an AI agent: Claude by default, Copilot on request or when Claude can't.
#
# Claude takes every issue the owner (or a collaborator) opens without the "needs-human" or "copilot" label, and any
# issue given the "claude" label. It keeps a checklist in a comment on the issue and commits to an "agent/issue-..."
# branch, and the job then opens the pull request as the bot App, so CI runs on it and the retry and CI-fix agents
# cover it, as on every agent branch. The pull request has the "automerge" label: it merges by itself once CI is green
# (automerge.yml). "@claude ..." in a comment on an issue or pull request asks Claude for more. Claude runs through
# the machinery's claude action, on the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) or an Anthropic API key
# (ANTHROPIC_API_KEY).
#
# The "copilot" label hands an issue to Copilot instead, and "@copilot ..." in a comment asks Copilot. Copilot works
# the same way as Claude: the Copilot CLI (the machinery's copilot action, on COPILOT_GITHUB_TOKEN) commits to an
# "agent/issue-..." branch, or to the pull request's own, and the bot App pushes, opens the pull request and posts
# Copilot's answer. GitHub's Copilot cloud agent isn't used: its pull requests start as "[WIP]" drafts with an empty
# "Initial plan" commit, ask the owner for a review and wait for the owner to approve their workflow runs.
# The Claude job adds the label itself when Claude can't take an issue (no credential, usage limit, error).
# When Copilot can't take the issue either, the label comes off again.
#
# An issue the agents ran out of credit for (Copilot's, or Claude's when Copilot isn't set up) gets the
# "retry next week" label instead, without their error comments. Taking that label off, by hand or on Monday by
# retry.yml, starts again from Claude, unless the issue needs a human: the retry job gives the issue the
# "claude" label again, as the bot App, since Claude Code's action can't start from a label being taken off.

# The app's caller runs this on issues (opened, labeled, unlabeled), issue comments, and pull request review comments
# and reviews: docs/02-new-app.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    # People with write access only, never bots: the agents' own issues are the ones that need a human. The bot App
    # only hands back an issue the agents had already taken, with the "claude" label (the retry job below).
    # An issue opened with the "claude" label is left to its "labeled" event, so it isn't taken twice.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'claude' &&
       (github.event.sender.type == 'User' || github.event.sender.login == vars.GH_APP_LOGIN)) ||
      (github.event.sender.type == 'User' && (
        (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                  github.event.comment.author_association || github.event.review.author_association ||
                  github.event.issue.author_association) &&
         ((github.event.action == 'opened' &&
           !contains(github.event.issue.labels.*.name, 'needs-human') &&
           !contains(github.event.issue.labels.*.name, 'copilot') &&
           !contains(github.event.issue.labels.*.name, 'claude')) ||
          contains(github.event.comment.body || github.event.review.body, '@claude')))))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per job, not per workflow: comments that don't call Claude must not cancel a queued request
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      # The bot App's token, not the read-only workflow token: on issues the Claude action fetches the base branch with
      # the checkout's credentials, and git still sends them when Claude pushes, since actions/checkout keeps them in a
      # file of its own that the Claude action doesn't replace (GitHub refused Claude's push with the workflow token)
      - id: git-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.git-token.outputs.token }}
      - id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - name: Keep the machinery out of the app's commits
        run: echo ".machinery/" >> .git/info/exclude
      # A failure is dealt with below: the issue goes to Copilot, or waits for next week, and the run fails only on
      # errors other than a used-up quota
      - id: claude
        continue-on-error: true
        uses: ./.machinery/.github/actions/claude
        with:
          # The bot App's "claude" label retries an issue
          allowed-bots: ${{ vars.GH_APP_LOGIN }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          app-client-id: ${{ vars.GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          branch-prefix: agent/
          track-progress: "true"
          prompt: |
            Read AGENTS.md before changing anything: it holds the rules for AI agents. README.md describes the app.

            - If the task needs a human (what AGENTS.md reserves for the owner, credentials, the stores' consoles, or
              a choice only the owner can make), change nothing: say in your comment what the owner must do, and
              stop. On an issue, the workflow then labels it `needs-human`.
            - Keep the change to what was asked.
            - Run `./gradlew check` and make it pass before every push. Wait for every command to finish: this run
              ends when you stop, and whatever isn't pushed by then is lost.
            - Commit every change yourself, as Conventional Commits. On an issue, the first commit's subject becomes
              the pull request's title, which decides the release: make it name the whole change, e.g.
              `feat(game): replay the song from the beginning`.
            - Never put an issue number in a commit message (`Closes #12`, `Fixes #12` or a bare `#12`): commit
              messages become the release notes and the stores' "What's new". The pull request closes the issue.
            - On an issue, finish with the whole change committed and leave out the "Create a PR" link: the workflow
              then opens the pull request, which closes the issue when merged.
      # Claude couldn't take the issue. The copilot label, added as the bot App so that it starts the Copilot job, hands
      # it over; without Copilot, an issue Claude had no quota left for waits for next week
      - id: handover
        if: steps.claude.outputs.done != 'true' && github.event_name == 'issues'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Hand the issue over
        if: steps.handover.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.handover.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COPILOT_READY: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          OUT_OF_CREDIT: ${{ steps.claude.outputs.out-of-credit }}
        run: |
          if [ "$COPILOT_READY" = "true" ]; then
            gh issue edit "$ISSUE" --add-label copilot
          elif [ "$OUT_OF_CREDIT" = "true" ]; then
            .machinery/.github/scripts/take-agents-off.sh "$ISSUE" --retry-next-week
          fi
      - name: Open the pull request
        if: >-
          steps.claude.outputs.done == 'true' && steps.claude.outputs.branch-name != '' &&
          github.event.issue && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ steps.claude.outputs.app-token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.claude.outputs.branch-name }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The oldest commit names the change; nothing comes back when Claude pushed nothing. Asked about a branch that
          # isn't on GitHub, gh prints GitHub's "Not Found" reply instead, which would become the title
          title=""
          if gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --silent 2>/dev/null; then
            title="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH" --jq '.commits[0].commit.message // ""' | head -n1)"
          fi
          if [ -z "$title" ]; then
            # Commits Claude made that aren't on GitHub: the push was refused, and they are lost with this runner
            if [ "$(git rev-list --count "origin/$BASE..$BRANCH" 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "::error title=Claude's branch was never pushed::GitHub refused the push of $BRANCH, so Claude's commits are lost with this runner. Claude's comment on #$ISSUE should give git's error."
              exit 1
            fi
            # Given an issue (not asked something in a comment), Claude commits nothing only when the issue needs the
            # owner, as its comment says: the label shows it, and keeps the agents off it
            if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
              gh label create needs-human --color D93F0B --description "Automation could not handle this" --force
              gh issue edit "$ISSUE" --add-label needs-human
              echo "::notice::Claude committed nothing: #$ISSUE needs a human, as Claude's comment says."
            else
              echo "Claude pushed no commits."
            fi
            exit 0
          fi
          gh label create agent --color 1D76DB --description "Opened by an AI agent" --force
          gh label create automerge --color 0E8A16 --description "Merge automatically once CI is green" --force
          gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --label agent --label automerge \
            --body "Closes #$ISSUE. Claude's work on the issue, from [this run]($RUN_URL); it merges by itself once CI is green. Comment \`@claude ...\` to ask for changes."
      # Waiting for the quota is handled above; any other error of Claude's is the automation's, for Automation health
      - name: Report Claude's failure
        if: steps.claude.outcome == 'failure' && steps.claude.outputs.out-of-credit != 'true'
        env:
          WHY: ${{ steps.claude.outputs.error }}
        run: |
          echo "Claude couldn't finish: ${WHY:-see the Claude step}"
          exit 1

  copilot:
    name: Copilot
    # The "copilot" label, added by a person or by the Claude job above as the bot App, or "@copilot ..." from someone
    # with write access, never from a bot
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'copilot' &&
       (github.event.sender.type == 'User' || github.event.sender.login == vars.GH_APP_LOGIN)) ||
      (github.event.sender.type == 'User' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association || github.event.review.author_association) &&
       contains(github.event.comment.body || github.event.review.body, '@copilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Copilot reads the issue or pull request with the workflow token
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: copilot-${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      # Asked on a pull request, Copilot works on its branch; given an issue, on a new one, named as Claude's
      - name: Choose the branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.pull_request && github.event.issue.number || '' }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$PR" ]; then
            { echo "name=agent/issue-$ISSUE-$(date -u +%Y%m%d-%H%M)"; echo "ref=$BASE"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "|| true": a pull request gh can't show is reported below, not by the step ending here
          read -r head fork <<< "$(gh pr view "$PR" --json headRefName,isCrossRepository --jq '"\(.headRefName) \(.isCrossRepository)"' || true)"
          if [ -z "$head" ]; then
            echo "::error::Pull request #$PR wasn't found."
            exit 1
          elif [ "$fork" = "true" ]; then
            echo "::error::#$PR comes from a fork: Copilot only pushes to this repository's branches."
            exit 1
          fi
          { echo "name=$head"; echo "ref=$head"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.ref }}
          persist-credentials: false
      - id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - name: Keep the machinery out of the app's commits
        run: echo ".machinery/" >> .git/info/exclude
      - name: Start the branch
        id: start
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          NEW: ${{ steps.branch.outputs.new }}
        run: |
          git config user.name "Copilot"
          git config user.email "198982749+Copilot@users.noreply.github.com"
          if [ "$NEW" = "true" ]; then
            git switch -c "$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Write the task
        id: task
        env:
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          NEW: ${{ steps.branch.outputs.new }}
          ASKED: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          if [ "$NEW" = "true" ]; then
            task="Your task is issue #$NUMBER: \`gh issue view $NUMBER --comments\` shows it and its discussion."
          else
            task="You are on the branch of pull request #$NUMBER: \`gh pr view $NUMBER --comments\` shows it and its discussion, \`gh pr diff $NUMBER\` its changes."
          fi
          if [ -n "$ASKED" ]; then
            task="$(printf '%s\n\nThe owner asked you in a comment there:\n\n%s' "$task" "$ASKED")"
          fi
          delimiter="EOF-$(openssl rand -hex 8)"
          printf 'text<<%s\n%s\n%s\n' "$delimiter" "$task" "$delimiter" >> "$GITHUB_OUTPUT"
      # A failure is dealt with below, as Claude's
      - id: copilot
        continue-on-error: true
        uses: ./.machinery/.github/actions/copilot
        with:
          copilot-github-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          prompt: |
            Read AGENTS.md before changing anything: it holds the rules for AI agents. README.md describes the app.

            ${{ steps.task.outputs.text }}

            - If the task needs a human (what AGENTS.md reserves for the owner, credentials, the stores' consoles, or
              a choice only the owner can make), change nothing: say what the owner must do, and stop. On an issue,
              the workflow then labels it `needs-human`.
            - Keep the change to what was asked.
            - Run `./gradlew check` and make it pass before you finish.
            - Commit every change yourself, as Conventional Commits, and push nothing: the workflow pushes your
              commits and, for an issue, opens the pull request. Its title is your first commit's subject, which
              decides the release: make it name the whole change, e.g. `feat(game): replay the song from the
              beginning`.
            - Never put an issue number in a commit message (`Closes #12`, `Fixes #12` or a bare `#12`): commit
              messages become the release notes and the stores' "What's new". The pull request closes the issue.
            - End with a short summary of what you changed, or of what the owner must do: the workflow posts it as
              a comment.
      - id: token
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Push Copilot's commits
        id: push
        if: steps.copilot.outputs.done == 'true'
        uses: ./.machinery/.github/actions/publish-commits
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.branch.outputs.name }}
          start: ${{ steps.start.outputs.sha }}
          open-pull-request: ${{ steps.branch.outputs.new }}
          body: >-
            Closes #${{ github.event.issue.number }}. Copilot's work on the issue, from
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}); it merges
            by itself once CI is green. Comment `@copilot ...` to ask for changes.
      # Given an issue, Copilot commits nothing only when the issue needs the owner, as its answer says: the label shows
      # it, and keeps the agents off it
      - name: Mark the issue for the owner
        if: >-
          steps.copilot.outputs.done == 'true' && steps.push.outputs.pushed != 'true' &&
          steps.branch.outputs.new == 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create needs-human --color D93F0B --description "Automation could not handle this" --force
          gh issue edit "$ISSUE" --add-label needs-human
          echo "::notice::Copilot committed nothing: #$ISSUE needs a human, as Copilot's answer says."
      # Copilot's answer, or why it couldn't finish. Out of credit on an issue, nothing: the issue waits for next week
      - name: Answer
        if: >-
          !cancelled() && steps.token.outcome == 'success' &&
          (steps.copilot.outputs.done == 'true' || steps.copilot.outputs.error != '') &&
          !(github.event_name == 'issues' && steps.copilot.outputs.out-of-credit == 'true')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DONE: ${{ steps.copilot.outputs.done }}
          RESPONSE: ${{ steps.copilot.outputs.response }}
          WHY: ${{ steps.copilot.outputs.error }}
          PULL_REQUEST: ${{ steps.push.outputs.pull-request }}
          PUSHED: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DONE" = "true" ]; then
            body="$(printf '%s\n\n— Copilot, in [this run](%s)%s' "$RESPONSE" "$RUN_URL" "${PULL_REQUEST:+: $PULL_REQUEST}")"
            if [ "$PUSHED" = "failure" ]; then
              body="$(printf '%s\n\nIts commits could not be pushed: see the run.' "$body")"
            fi
          else
            # "encountered an error", as Claude's: take-agents-off.sh deletes these comments when the issue waits
            body="$(printf 'Copilot encountered an error in [this run](%s): %s' "$RUN_URL" "$WHY")"
          fi
          gh issue comment "$NUMBER" --body "$body"
      # Given an issue it couldn't finish (no token, no credit, error), the label comes off, with Copilot, so that adding
      # it again tries again; out of credit, the issue waits for next week
      - name: Take Copilot off
        if: >-
          !cancelled() && github.event_name == 'issues' && steps.token.outcome == 'success' &&
          steps.copilot.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OUT_OF_CREDIT: ${{ steps.copilot.outputs.out-of-credit }}
        run: |
          if [ "$OUT_OF_CREDIT" = "true" ]; then
            .machinery/.github/scripts/take-agents-off.sh "$ISSUE" --retry-next-week
            echo "::notice::Copilot ran out of credit: #$ISSUE waits for next week's reset."
          else
            .machinery/.github/scripts/take-agents-off.sh "$ISSUE"
          fi
      # Waiting for the quota is handled above; any other error of Copilot's is the automation's, for Automation health
      - name: Report Copilot's failure
        if: steps.copilot.outcome == 'failure' && steps.copilot.outputs.out-of-credit != 'true'
        env:
          WHY: ${{ steps.copilot.outputs.error }}
        run: |
          echo "Copilot couldn't finish: ${WHY:-see the Copilot step}"
          exit 1

  retry:
    name: Retry
    # The "retry next week" label came off, by hand or on Monday (retry.yml): unless the issue needs a human, the
    # "claude" label, given again as the bot App, starts the Claude job and, if Claude can't, Copilot
    if: >-
      github.event.action == 'unlabeled' && github.event.label.name == 'retry next week' &&
      (github.event.sender.type == 'User' || github.event.sender.login == vars.GH_APP_LOGIN) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'needs-human')
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Give the issue to Claude again
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api -X DELETE "repos/$GH_REPO/issues/$ISSUE/labels/claude" --silent 2>/dev/null || true
          gh label create claude --color C15F3C --description "Claude agent responsibility" --force
          gh issue edit "$ISSUE" --add-label claude
