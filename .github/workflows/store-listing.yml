name: Store listing

# Brings the Google Play store listing's icon, feature graphic and phone screenshots up to date: the app's own test
# draws them with its own code (the `art` input), and the release tool replaces the kinds that changed, in the
# listing's default language. Unchanged ones stay as they are, since every change goes through Google's review again.
# The app's caller runs this after each release, and by hand.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to draw the graphics from (the default branch's newest without it)
        type: string
        default: ""
      art:
        description: The Gradle tasks that draw the listing's graphics
        type: string
        default: ":composeApp:testAndroidHostTest --tests *StoreArtTest --rerun"
      art-dir:
        description: Where they draw them
        type: string
        default: composeApp/build/store-art

permissions:
  contents: read

jobs:
  listing:
    name: Google Play listing graphics
    # Like the upload, it waits for the app to be on Play.
    if: vars.PLAY_TRACK != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: machinery
        name: Find the machinery
        env:
          WORKFLOW: ${{ job.workflow_ref }}
        run: echo "repository=${WORKFLOW%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
      - name: Check out the machinery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.machinery.outputs.repository }}
          ref: ${{ job.workflow_sha }}
          path: .machinery
          persist-credentials: false
      - uses: ./.machinery/.github/actions/setup-build
      # --rerun in the default: the pictures aren't outputs of the test task, so Gradle's cache can't bring them back.
      - name: Draw the icon, the feature graphic and the screenshots
        env:
          TASKS: ${{ inputs.art }}
        # Word splitting is wanted: the tasks and options are separate arguments
        run: ./gradlew $TASKS
      - id: wif
        name: Authenticate with Workload Identity Federation
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - id: key
        name: Authenticate with the service account key
        if: vars.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Build the release tool
        run: ./.machinery/gradlew -p .machinery :tools:release:installDist --quiet
      - name: Replace the graphics that changed
        env:
          PLAY_PACKAGE_NAME: ${{ vars.APP_ID }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.key.outputs.access_token }}
          ART: ${{ inputs.art-dir }}
        run: .machinery/tools/release/build/install/release/bin/upload-listing "$ART"
