name: Automation health

# When an agent workflow itself fails, nothing tries to "fix" it (that could loop): this records the failure in a
# single pinned "Automation health" issue for the owner instead, with its cause: the failed jobs' errors, such as the
# reason the Claude action or the Copilot engine gives for stopping.

# The app's caller runs this on workflow_run of its agent workflows (issue, CI-fix, upgrade, refresh, retry):
# docs/02-new-app.md.

on:
  workflow_call:

permissions:
  issues: write
  contents: read
  # The failed run's jobs, and their annotations
  actions: read
  checks: read

jobs:
  report:
    name: Record the failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Update the Automation health issue
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          title="Automation health"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          # The runner's own "exit code" lines and the actions' generic "failed" lines say nothing about the cause
          why="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id' |
            while read -r job; do
              gh api "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" \
                --jq '.[] | select(.annotation_level == "failure") | .message | gsub("[[:space:]]+"; " ")'
            done |
            grep -vE 'exit code|exited with code|is_error:true|could not complete the task|result file not found' |
            awk '!seen[$0]++' | head -n 3 | cut -c1-400 | awk 'NR > 1 { printf "; " } { printf "%s", $0 }' || true)"
          line="- $(date -u +%Y-%m-%d) **$NAME** failed: $URL${why:+ — $why}"
          if [ -z "$number" ]; then
            gh label create needs-human --color D93F0B --description "Automation could not handle this" --force --repo "$GITHUB_REPOSITORY"
            number="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label needs-human \
              --body "Failures of the automation itself are listed here (agents never retry their own failures)." \
              | grep -o '[0-9]*$')"
            gh issue pin "$number" --repo "$GITHUB_REPOSITORY" || true
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$line"
