name: Self release

# Releases the machinery after Self CI passes on main: semantic-release tags vX.Y.Z from the Conventional Commits and
# makes the GitHub Release, then the plugins of that version join the Maven repository on the machinery's GitHub Pages
# (the `gh-pages` branch, under maven/), next to every earlier version. Dependabot then offers the new release to every
# app: the workflows by their commit, the plugins by their version.

on:
  workflow_run:
    workflows: [Self CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-release
  cancel-in-progress: false

jobs:
  release:
    name: Version and GitHub Release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: semantic
        uses: cycjimmy/semantic-release-action@b4630c55afc332e0d8a732e0441849968e5cccaf # v8.0.0
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plugins:
    name: Publish the plugins
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      # The site keeps every version published so far: Gradle merges the new one into its metadata
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Publish into the site
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: ./gradlew -p plugins publish "-Pmachinery.version=$VERSION" "-Pmachinery.repository=$GITHUB_WORKSPACE/site/maven"
      - name: Push the site
        env:
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -m "chore: publish the plugins $VERSION"
          git push
